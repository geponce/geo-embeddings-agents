name: geo-embeddings
channels:
  - conda-forge
dependencies:
  - python=3.11
  - earthengine-api
  - geemap
  - geopandas
  - rasterio
  - xarray
  - pandas
  - numpy>=2
  - pyarrow
  - scikit-learn
  - matplotlib
  - jupyterlab
  - pytest
  - python-dotenv
  - pip
  - pip:
      - -e .
      - databricks-sdk
      # databricks-connect is left out: on Python 3.11 its latest release pins numpy<2,
      # which breaks pyarrow and scikit-learn. Not needed (Databricks code runs in the workspace).
      - mlflow
      - claude-agent-sdk
